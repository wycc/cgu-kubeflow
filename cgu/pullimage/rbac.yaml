apiVersion: v1
kind: ServiceAccount
metadata:
  name: pullimage-sa
  namespace: pullimage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pullimage-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pullimage-binding
subjects:
  - kind: ServiceAccount
    name: pullimage-sa
    namespace: pullimage
roleRef:
  kind: ClusterRole
  name: pullimage-role
  apiGroup: rbac.authorization.k8s.io
