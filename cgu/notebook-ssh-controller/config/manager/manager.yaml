apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook-ssh-controller-manager
  namespace: cgu
  labels:
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - /manager
        args:
        - --metrics-bind-address=127.0.0.1:8080
        - --health-probe-bind-address=:8081
        - --leader-elect
        image: cguaicadmin/notebook-ssh-controller:1.0.6
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 10m
            memory: 64Mi
      serviceAccountName: default # 使用 'default' ServiceAccount
      terminationGracePeriodSeconds: 10