# 1) VirtualService（同上）
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pvcviewer-{namespace}-{notenotename}
  namespace: {namesapce}
spec:
  gateways:
  - kubeflow/kubeflow-gateway
  hosts:
  - "*"
  http:
  - name: pvcviewer-{namespace}-{notebookname}-share-public
    match:
    - uri:
        prefix: /pvcviewers/{namespace}/{notebookname}-workspace/share/
    route:
    - destination:
        host: pvcviewer-{notebookname}-workspace.{namespace}.svc.cluster.local
        port:
          number: 80
---
# 2) EnvoyFilter（同上）
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: bypass-auth-pvcviewer-{namesapce}-{notebookname}-share
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
  - applyTo: HTTP_ROUTE
    match:
      context: GATEWAY
      routeConfiguration:
        vhost:
          name: '*:8080'
          route:
            name: pvcviewer-{namespace}-{notebookname}-share-public
    patch:
      operation: MERGE
      value:
        typed_per_filter_config:
          envoy.filters.http.ext_authz:
            '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
            disabled: true
  - applyTo: HTTP_ROUTE
    match:
      context: GATEWAY
      routeConfiguration:
        vhost:
          name: '*:443'
          route:
            name: pvcviewer-{namesapce}-{notebookname}-share-public
    patch:
      operation: MERGE
      value:
        typed_per_filter_config:
          envoy.filters.http.ext_authz:
            '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
            disabled: true
---
# 3) Gateway 層 ALLOW（修正 path）
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-public-pvcviewer-share-gw
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
  - to:
    - operation:
        paths:
        - /pvcviewers/{namespace}/{notebookname}-workspace/share/*
---
# 4) 後端 inbound ALLOW（selector 指 label）
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-public-pvcviewer-{namespace}-{notebookname}-inbound
  namespace: {namespace}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: pvcviewer-{notebookname}-workspace
  action: ALLOW
  rules:
  - to:
    - operation:
        methods: ["GET","HEAD","OPTIONS"]
        paths:
        - /pvcviewers/{namespace}/{notebookname}-workspace/share/*
        - /share/*
